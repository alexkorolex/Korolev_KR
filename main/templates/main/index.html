<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Таблица словаря</title>
    <style>
        body {
            max-width: 760px;
            margin: 48px auto;
            padding: 0 20px;
            color: #222;
            font: 16px/1.5 Arial, sans-serif;
        }
        h1 { margin-bottom: 8px; }
        .muted { color: #666; }
        form.add-form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 24px 0;
        }
        input {
            flex: 1 1 180px;
            min-width: 0;
            padding: 9px 10px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font: inherit;
        }
        button {
            padding: 8px 12px;
            border: 1px solid #888;
            border-radius: 4px;
            background: #f5f5f5;
            color: #222;
            font: inherit;
            cursor: pointer;
        }
        button:hover { background: #e9e9e9; }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        th { background: #f5f5f5; }
        .delete-form { margin: 0; }
        .delete-button { color: #9b2226; }
        .error { color: #9b2226; }
        @media (max-width: 520px) {
            body { margin-top: 28px; }
            th, td { padding: 8px 5px; }
        }
    </style>
</head>
<body>
    <h1>Таблица словаря</h1>
    <p class="muted">Добавляйте пары «ключ — значение» и удаляйте ненужные строки.</p>

    <form class="add-form" method="get">
        <input type="hidden" name="action" value="add">
        <input type="text" name="key" placeholder="Ключ" aria-label="Ключ" required>
        <input type="text" name="value" placeholder="Значение" aria-label="Значение" required>
        <button type="submit">Добавить строку</button>
    </form>

    {% if error %}
        <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <table>
        <thead>
            <tr>
                <th scope="col">Ключ</th>
                <th scope="col">Значение</th>
                <th scope="col">Действие</th>
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
                <tr>
                    <td>{{ row.key }}</td>
                    <td>{{ row.value }}</td>
                    <td>
                        <form class="delete-form" method="post">
                            {{ csrf_input }}
                            <input type="hidden" name="action" value="delete">
                            <input type="hidden" name="row_id" value="{{ row.id }}">
                            <button class="delete-button" type="submit" aria-label="Удалить строку {{ row.key }}">Удалить</button>
                        </form>
                    </td>
                </tr>
            {% else %}
                <tr>
                    <td class="muted" colspan="3">В словаре пока нет строк. Добавьте первую выше.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
