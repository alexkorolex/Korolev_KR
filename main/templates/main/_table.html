<table>
    <thead>
        <tr>
            <th scope="col">Ключ</th>
            <th scope="col">Значение</th>
            <th scope="col">Действие</th>
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
            <tr>
                <td>{{ row.key }}</td>
                <td>{{ row.value }}</td>
                <td>
                    <form class="delete-form" method="post">
                        {{ csrf_input }}
                        <input type="hidden" name="action" value="delete">
                        <input type="hidden" name="row_id" value="{{ row.id }}">
                        <button class="delete-button" type="submit" aria-label="Удалить строку {{ row.key }}">Удалить</button>
                    </form>
                </td>
            </tr>
        {% else %}
            <tr>
                <td class="muted" colspan="3">В словаре пока нет строк. Добавьте первую выше.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
